name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        san: ["", "-fsanitize=address,undefined -fno-sanitize-recover=undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: "make test: ABI check, unit tests, oracle bench, JIT differentials"
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 ${{ matrix.san }}" test
      - name: "Rust: clippy and the crate's own tests"
        if: matrix.san == '' && matrix.cc == 'gcc'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: "Rust without std (no_std with alloc, as DashOS uses it)"
        if: matrix.san == '' && matrix.cc == 'gcc'
        run: |
          rustup target add x86_64-unknown-none
          cargo clippy --release --no-default-features --target x86_64-unknown-none -- -D warnings
      - name: SingleStepTests/m68000, interpreter and JIT
        if: matrix.san == ''
        run: |
          make data
          make CC=${{ matrix.cc }} sst
          make CC=${{ matrix.cc }} sst JIT=1

  # Windows is written but was never run with the Rust library: it may fail
  # until V1 is done.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-rust
      - run: make CC=gcc test
